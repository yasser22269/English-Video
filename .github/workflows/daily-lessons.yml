name: 📚 Daily English Lessons

on:
  schedule:
    # 09:00 UTC — just after the YouTube quota resets at Pacific midnight, so a
    # run always starts with a full 10,000 units. Also a reasonable publish hour
    # for the audience: 11:00 Cairo, 10:00 London, 05:00 New York.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      level:
        description: 'Single level to build (blank = all five)'
        required: false
        default: ''
        type: choice
        options: ['', 'a1', 'a2', 'b1', 'b2', 'c1']
      skill:
        description: 'Skill override (only with a level)'
        required: false
        default: ''
        type: choice
        options: ['', 'speaking', 'vocabulary', 'reading', 'listening']
      upload:
        description: 'Upload to YouTube'
        required: false
        default: true
        type: boolean

concurrency:
  # Two overlapping runs would both spend the same daily quota and race on the
  # rotation state file.
  group: daily-lessons
  cancel-in-progress: false

env:
  NODE_OPTIONS: '--no-deprecation'

jobs:
  lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # Node 20 on purpose: the runner image's newer default broke googleapis'
      # OAuth token refresh with "Premature close" on every upload.
      - name: ⬢ Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 🎥 ffmpeg and fonts
        run: |
          sudo apt-get update
          # fonts-noto-core carries both Noto Sans and Noto Sans Arabic, which
          # libass and Chromium both need — without the Arabic face the burned-in
          # translation renders as empty boxes.
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-liberation
          fc-list | grep -ci "noto sans arabic" || (echo "::error::Arabic font missing" && exit 1)

      - name: 🧩 Chromium libraries
        run: |
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libcairo2 libcups2 \
            libdbus-1-3 libdrm2 libexpat1 libgbm1 libglib2.0-0 libnspr4 libnss3 \
            libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2

      - name: 🗂 Cache Puppeteer's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 📦 Install dependencies
        run: |
          npm ci
          pip install --upgrade -r requirements.txt

      # Generating five lessons costs roughly an hour of runner time. Finding out
      # afterwards that the refresh token died is an hour wasted, so check first.
      - name: 🔐 Verify YouTube credentials
        if: ${{ github.event.inputs.upload != 'false' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          RESP=$(curl -s --max-time 20 -X POST https://oauth2.googleapis.com/token \
            -d client_id="${YOUTUBE_CLIENT_ID}" \
            -d client_secret="${YOUTUBE_CLIENT_SECRET}" \
            -d refresh_token="${YOUTUBE_REFRESH_TOKEN}" \
            -d grant_type=refresh_token)
          if echo "$RESP" | grep -q '"access_token"'; then
            echo "✅ refresh token is valid"
          else
            ERR=$(echo "$RESP" | grep -o '"error_description": *"[^"]*"' || echo "$RESP" | head -c 200)
            echo "::error title=YouTube refresh token expired or revoked::${ERR}"
            {
              echo "## ❌ YouTube refresh token is dead"
              echo ""
              echo "**Error:** \`${ERR}\`"
              echo ""
              echo "### Fix it once, properly"
              echo "1. Google Cloud Console → APIs & Services → **OAuth consent screen** → set publishing status to **In production**. A token issued while the app is in *Testing* expires every 7 days, which is why this keeps coming back."
              echo "2. Locally: \`npm run auth:youtube\`, approve in the browser."
              echo "3. The script updates the \`YOUTUBE_REFRESH_TOKEN\` repo secret via the gh CLI, or prints the command to do it by hand."
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 🎬 Build today's lessons
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
          AUDIO_PRESET: ${{ vars.AUDIO_PRESET || 'broadcast' }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'pollinations' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.level }}" ]; then
            ARGS="--level ${{ github.event.inputs.level }}"
            [ -n "${{ github.event.inputs.skill }}" ] && ARGS="$ARGS --skill ${{ github.event.inputs.skill }}"
          fi
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then
            ARGS="$ARGS --no-upload"
          fi
          echo "node src/generate.js $ARGS"
          node src/generate.js $ARGS

      # MP4s are 10-80 MB each and already on YouTube; keeping them on every run
      # would blow the artifact quota within a week. Only on failure, briefly.
      - name: 📤 Keep the evidence when a run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-${{ github.run_number }}
          path: |
            output/**/lesson.json
            output/**/captions.ass
            output/**/metadata.json
            output/**/thumbnail.jpg
          retention-days: 3
          if-no-files-found: ignore

      - name: 📝 Commit rotation state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # used-topics keeps lessons from repeating; history and quota are the
          # run log; playlists caches the playlist ids so the run stops
          # re-discovering them by title every day. Nothing from output/ is
          # ever committed.
          git add state/used-topics.json state/history.json state/quota.json state/playlists.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: lesson rotation state $(date -u +%F) [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt/5)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; exit 1; }
            sleep $((attempt * 3))
          done
          echo "::error::could not push rotation state"
          exit 1
