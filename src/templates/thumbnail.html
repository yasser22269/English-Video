<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #22C55E; --accent-dark: #15803D;
    --bg-a: #04120B; --bg-b: #082018; --bg-c: #05170F;
    --font-en: system-ui, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; font-family: var(--font-en); }

  #t {
    position: relative; width: 1280px; height: 720px; color: #fff;
    background:
      radial-gradient(900px 700px at 12% 0%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%),
      linear-gradient(145deg, var(--bg-a), var(--bg-b) 55%, var(--bg-c));
  }

  /* photo bleeds in from the right, faded into the gradient */
  #photo {
    position: absolute; right: 0; top: 0; width: 560px; height: 720px; object-fit: cover;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 34%);
            mask-image: linear-gradient(to right, transparent 0%, #000 34%);
  }
  #scrim { position: absolute; inset: 0;
    background: linear-gradient(100deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.45) 46%, transparent 74%); }

  #inner { position: absolute; inset: 0; padding: 56px 60px; display: flex; flex-direction: column; }

  .top { display: flex; align-items: center; gap: 18px; }
  .level {
    font-size: 30px; font-weight: 800; letter-spacing: .1em;
    padding: 12px 26px; border-radius: 12px; color: #06110C;
    background: linear-gradient(140deg, var(--accent), var(--accent-dark));
  }
  .skill {
    font-size: 26px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: #fff; padding: 12px 22px; border-radius: 12px;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.2);
  }

  h1 {
    margin-top: auto; font-size: 92px; line-height: .98; font-weight: 900;
    letter-spacing: -.03em; max-width: 800px;
    text-shadow: 0 8px 40px rgba(0,0,0,.7);
  }
  h1 em { font-style: normal; color: var(--accent); }

  .sub {
    margin-top: 24px; font-size: 34px; font-weight: 600; color: #CBD5E1; max-width: 760px;
    text-shadow: 0 4px 20px rgba(0,0,0,.8);
  }

  .foot { margin-top: 26px; display: flex; align-items: center; gap: 16px; }
  .foot .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
               box-shadow: 0 0 18px var(--accent); }
  .foot span { font-size: 24px; letter-spacing: .2em; text-transform: uppercase; color: #94A3B8; font-weight: 700; }

  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
            background: linear-gradient(90deg, var(--accent), transparent 70%); }
</style>
</head>
<body>
<div id="t">
  <img id="photo" class="hidden" alt="">
  <div id="scrim"></div>
  <div id="inner">
    <div class="top"><span class="level" id="level"></span><span class="skill" id="skill"></span></div>
    <h1 id="head"></h1>
    <div class="sub" id="sub"></div>
    <div class="foot"><span class="dot"></span><span id="brand"></span></div>
  </div>
  <div class="stripe"></div>
</div>
<script>
window.renderThumb = function (d) {
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries({
    '--accent': d.accent, '--accent-dark': d.accentDark,
    '--bg-a': d.bgA, '--bg-b': d.bgB, '--bg-c': d.bgC,
  })) if (v) root.setProperty(k, v);

  document.getElementById('level').textContent = d.level || '';
  document.getElementById('skill').textContent = d.skill || '';
  document.getElementById('sub').textContent = d.sub || '';
  document.getElementById('brand').textContent = d.brand || 'English Every Day';

  // The highlighted fragment is what the eye lands on first in a crowded feed.
  const head = document.getElementById('head');
  if (d.highlight && d.headline && d.headline.includes(d.highlight)) {
    const [before, after] = d.headline.split(d.highlight);
    head.innerHTML = '';
    head.append(document.createTextNode(before));
    const em = document.createElement('em');
    em.textContent = d.highlight;
    head.append(em, document.createTextNode(after));
  } else {
    head.textContent = d.headline || '';
  }

  const photo = document.getElementById('photo');
  if (d.image) { photo.src = d.image; photo.classList.remove('hidden'); }
  else { photo.remove(); }
  return true;
};
</script>
</body>
</html>
